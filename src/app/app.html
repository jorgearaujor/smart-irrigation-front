<div class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  @if (showChrome()) {
    <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-950/90">
      <div class="mx-auto flex max-w-6xl items-center gap-3 px-4 py-3 sm:px-6">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-emerald-600 text-white shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-6 w-6">
            <path d="M12 2C8 7 5 10.9 5 14.5A7 7 0 0 0 19 14.5C19 10.9 16 7 12 2Z" />
          </svg>
        </div>
        <div class="flex-1">
          <p class="text-lg font-bold leading-tight tracking-tight">SmartIrrigation</p>
          <p class="text-xs font-medium text-slate-500 dark:text-slate-400">Painel de Monitoramento &amp; Controle</p>
        </div>

        @if (auth.user(); as user) {
          <div class="flex items-center gap-2">
            @if (user.photoURL) {
              <img [src]="user.photoURL" [alt]="user.displayName ?? user.email ?? ''" class="h-8 w-8 rounded-full" />
            }
            <span class="hidden text-sm font-medium text-slate-600 dark:text-slate-300 sm:inline">
              {{ user.displayName ?? user.email }}
            </span>
            <button
              type="button"
              (click)="logout()"
              class="rounded-full border border-slate-300 px-3 py-1.5 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800"
            >
              Sair
            </button>
          </div>
        }
      </div>

      <nav class="mx-auto flex max-w-6xl gap-1 px-4 sm:px-6" aria-label="Navegação principal">
        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive
            #rla="routerLinkActive"
            [class.border-emerald-600]="rla.isActive"
            [class.text-emerald-700]="rla.isActive"
            [class.dark:text-emerald-400]="rla.isActive"
            [class.border-transparent]="!rla.isActive"
            [class.text-slate-500]="!rla.isActive"
            class="border-b-2 px-3 py-2.5 text-sm font-semibold transition-colors hover:text-emerald-700 dark:hover:text-emerald-400"
          >
            {{ item.label }}
          </a>
        }
      </nav>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-6 sm:px-6 sm:py-8">
      <router-outlet />
    </main>
  } @else {
    <router-outlet />
  }
</div>
