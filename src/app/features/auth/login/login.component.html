<div class="flex min-h-screen items-center justify-center bg-slate-50 px-4 dark:bg-slate-950">
  <div class="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-8 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <div class="text-center">
      <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-xl bg-emerald-600 text-white shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-8 w-8">
          <path d="M12 2C8 7 5 10.9 5 14.5A7 7 0 0 0 19 14.5C19 10.9 16 7 12 2Z" />
        </svg>
      </div>
      <h1 class="mt-4 text-xl font-bold tracking-tight">SmartIrrigation</h1>
      <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Login</p>
    </div>

    @if (error(); as message) {
      <div class="mt-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-700 dark:border-red-900 dark:bg-red-950/50 dark:text-red-400">
        {{ message }}
      </div>
    }

    <form class="mt-5 flex flex-col gap-4" (ngSubmit)="signIn()">
      <label class="block">
        <span class="text-sm font-semibold text-slate-600 dark:text-slate-300">Login</span>
        <input
          type="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          autocomplete="email"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base focus:border-emerald-500 focus:outline-none dark:border-slate-700 dark:bg-slate-800"
        />
      </label>

      <label class="block">
        <span class="text-sm font-semibold text-slate-600 dark:text-slate-300">Senha</span>
        <input
          type="password"
          [ngModel]="senha()"
          (ngModelChange)="senha.set($event)"
          name="senha"
          autocomplete="current-password"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base focus:border-emerald-500 focus:outline-none dark:border-slate-700 dark:bg-slate-800"
        />
      </label>

      <button
        type="submit"
        [disabled]="signingIn()"
        class="mt-2 w-full rounded-xl bg-emerald-600 px-4 py-3 text-base font-bold text-white shadow-sm transition hover:bg-emerald-700 disabled:opacity-60"
      >
        {{ signingIn() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
