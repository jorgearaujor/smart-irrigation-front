<div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
  @for (tile of tiles(); track tile.label) {
    <div [class]="tile.cardClass">
      <p class="text-sm font-semibold text-slate-500 dark:text-slate-400">{{ tile.label }}</p>
      <p [class]="tile.valueClass">{{ tile.value }}</p>
    </div>
  }
</div>
