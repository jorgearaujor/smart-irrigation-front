<div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">
  <h2 class="text-lg font-bold tracking-tight">Parâmetros Agronômicos</h2>
  <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
    Usados no cálculo da evapotranspiração (ETo) e da lâmina de irrigação.
  </p>

  @if (form(); as f) {
    <div class="mt-5 grid grid-cols-1 gap-4 sm:grid-cols-2">
      <label class="block">
        <span class="text-sm font-semibold text-slate-600 dark:text-slate-300">Umidade mínima do solo (%)</span>
        <input
          type="number"
          step="1"
          [ngModel]="f.limiar_umidade_minima"
          (ngModelChange)="updateField('limiar_umidade_minima', $event)"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base focus:border-emerald-500 focus:outline-none dark:border-slate-700 dark:bg-slate-800"
        />
      </label>

      <label class="block">
        <span class="text-sm font-semibold text-slate-600 dark:text-slate-300">Espaçamento entre plantas (m)</span>
        <input
          type="number"
          step="0.01"
          [ngModel]="f.espacamento_plantas_m"
          (ngModelChange)="updateField('espacamento_plantas_m', $event)"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base focus:border-emerald-500 focus:outline-none dark:border-slate-700 dark:bg-slate-800"
        />
      </label>

      <label class="block">
        <span class="text-sm font-semibold text-slate-600 dark:text-slate-300">Espaçamento entre linhas (m)</span>
        <input
          type="number"
          step="0.01"
          [ngModel]="f.espacamento_linhas_m"
          (ngModelChange)="updateField('espacamento_linhas_m', $event)"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base focus:border-emerald-500 focus:outline-none dark:border-slate-700 dark:bg-slate-800"
        />
      </label>

      <label class="block">
        <span class="text-sm font-semibold text-slate-600 dark:text-slate-300">Vazão do gotejador (L/h)</span>
        <input
          type="number"
          step="0.1"
          [ngModel]="f.vazao_gotejador_lph"
          (ngModelChange)="updateField('vazao_gotejador_lph', $event)"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base focus:border-emerald-500 focus:outline-none dark:border-slate-700 dark:bg-slate-800"
        />
      </label>

      <label class="block">
        <span class="text-sm font-semibold text-slate-600 dark:text-slate-300">Gotejadores por planta</span>
        <input
          type="number"
          step="1"
          [ngModel]="f.num_gotejadores_planta"
          (ngModelChange)="updateField('num_gotejadores_planta', $event)"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base focus:border-emerald-500 focus:outline-none dark:border-slate-700 dark:bg-slate-800"
        />
      </label>

      <label class="block">
        <span class="text-sm font-semibold text-slate-600 dark:text-slate-300">Quantidade total de plantas</span>
        <input
          type="number"
          step="1"
          [ngModel]="f.numero_total_plantas"
          (ngModelChange)="updateField('numero_total_plantas', $event)"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base focus:border-emerald-500 focus:outline-none dark:border-slate-700 dark:bg-slate-800"
        />
      </label>
    </div>

    <div class="mt-5 flex items-center gap-3">
      <button
        type="button"
        (click)="save()"
        [disabled]="saving()"
        class="rounded-xl bg-slate-900 px-5 py-2.5 text-sm font-bold text-white shadow-sm transition hover:bg-slate-700 disabled:opacity-60 dark:bg-emerald-600 dark:hover:bg-emerald-700"
      >
        {{ saving() ? 'Salvando...' : 'Salvar Parâmetros' }}
      </button>
      @if (saved()) {
        <span class="text-sm font-semibold text-emerald-600 dark:text-emerald-400">Parâmetros atualizados ✓</span>
      }
    </div>
  } @else {
    <p class="mt-5 text-sm text-slate-500 dark:text-slate-400">Carregando parâmetros...</p>
  }
</div>
