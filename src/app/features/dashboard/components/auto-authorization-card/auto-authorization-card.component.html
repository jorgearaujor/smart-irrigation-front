<div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">
  <h2 class="text-lg font-bold tracking-tight">Irrigação Automática</h2>
  <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
    O dispositivo decide quando irrigar com base na umidade do solo e nos parâmetros agronômicos.
  </p>

  <div class="mt-5 grid grid-cols-2 gap-3 text-center">
    <div class="rounded-xl bg-slate-50 p-3 dark:bg-slate-800/60">
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Temp. mínima</p>
      <p class="text-xl font-bold">{{ irrigation.status()?.tempMin ?? '--' }}°C</p>
    </div>
    <div class="rounded-xl bg-slate-50 p-3 dark:bg-slate-800/60">
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Temp. máxima</p>
      <p class="text-xl font-bold">{{ irrigation.status()?.tempMax ?? '--' }}°C</p>
    </div>
  </div>

  <button
    type="button"
    (click)="toggleAuthorization()"
    [disabled]="submitting()"
    [class]="
      irrigation.isAuthorized()
        ? 'mt-5 w-full rounded-xl border-2 border-emerald-600 px-4 py-3 text-base font-bold text-emerald-700 transition hover:bg-emerald-50 disabled:opacity-60 dark:text-emerald-400 dark:hover:bg-emerald-950/40'
        : 'mt-5 w-full rounded-xl bg-emerald-600 px-4 py-3 text-base font-bold text-white shadow-sm transition hover:bg-emerald-700 disabled:opacity-60'
    "
  >
    {{ irrigation.isAuthorized() ? 'Desativar Irrigação Automática' : 'Autorizar Irrigação Automática' }}
  </button>
</div>
