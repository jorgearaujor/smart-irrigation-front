<div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">
  <h3 class="text-base font-bold tracking-tight">{{ title() }}</h3>
  <p class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">{{ unit() }}</p>

  <div class="mt-4 h-64">
    @if (points().length > 0) {
      <canvas baseChart [type]="'line'" [data]="chartData()" [options]="chartOptions"></canvas>
    } @else {
      <div class="flex h-full items-center justify-center text-sm text-slate-400 dark:text-slate-500">
        Sem dados no período selecionado.
      </div>
    }
  </div>
</div>
